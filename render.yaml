services:
  - type: web
    name: belvo-hr-operations
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: python serve.py
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: belvo-hr-operations.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://belvo-hr-operations.onrender.com
      - key: DATABASE_URL
        sync: false
